version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: guardian-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-guardian_db}
    ports:
      - "5432:5432"
    volumes:
      - guardian-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-guardian_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardian-app
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-guardian_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-admin123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GUARDIAN_JWT_SECRET: ${GUARDIAN_JWT_SECRET:-9a4f4e354567f123c88355aa7de9fd267a544567f123c88355aa7de9fd267a54}
      TZ: America/Bogota
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  guardian-postgres-data:
