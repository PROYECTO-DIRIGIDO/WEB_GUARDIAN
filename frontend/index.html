<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardian - Ecosistema de Investigación</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes wave1 {
      0%   { background-position: 0% 50%; }
      25%  { background-position: 50% 80%; }
      50%  { background-position: 100% 50%; }
      75%  { background-position: 50% 20%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes wave2 {
      0%   { opacity: 0.6; transform: scale(1);   }
      50%  { opacity: 1;   transform: scale(1.05); }
      100% { opacity: 0.6; transform: scale(1);   }
    }
    .animated-bg {
      background:
        radial-gradient(ellipse at 20% 60%, #0ea5e9 0%, transparent 55%),
        radial-gradient(ellipse at 80% 40%, #0d9488 0%, transparent 55%),
        radial-gradient(ellipse at 50% 90%, #06b6d4 0%, transparent 50%),
        linear-gradient(180deg, #020617 0%, #0f172a 40%, #042f2e 100%);
      background-size: 400% 400%, 300% 300%, 250% 250%, 100% 100%;
      animation: wave1 18s ease-in-out infinite, wave2 9s ease-in-out infinite;
    }
    * { font-family: 'Outfit', sans-serif; }
  </style>
</head>

<body class="animated-bg min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
